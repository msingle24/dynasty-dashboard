<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Any Given Sunday - Dynasty HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --card: #1c2029;
    --border: #252933;
    --accent: #00e5a0;
    --accent2: #ff6b35;
    --text: #e8eaf0;
    --muted: #6b7280;
    --green: #22c55e;
    --orange: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
    --cap-total: 200;
  }

  :root.light {
    --bg: #f0f2f5;
    --surface: #e2e5eb;
    --card: #ffffff;
    --border: #d1d5db;
    --accent: #00a572;
    --accent2: #e05a20;
    --text: #111827;
    --muted: #6b7280;
    --green: #16a34a;
    --orange: #d97706;
    --red: #dc2626;
    --blue: #2563eb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0d0f14 0%, #161920 50%, #0d1a14 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 24px;
    height: 64px;
    flex-wrap: wrap;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    flex-shrink: 0;
  }

  .logo span { color: var(--text); }

  .search-wrap {
    flex: 1;
    max-width: 320px;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px 8px 36px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 15px;
  }

  .nav-tabs {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }

  .nav-tab {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }

  .nav-tab:hover { color: var(--text); background: var(--surface); }
  .nav-tab.active { background: var(--accent); color: #0d0f14; }

  .theme-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    transition: all 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Barlow', sans-serif;
    font-weight: 500;
  }
  .theme-toggle:hover { border-color: var(--accent); }

  /* MAIN */
  .main { max-width: 1600px; margin: 0 auto; padding: 24px; }

  /* VIEWS */
  .view { display: none; }
  .view.active { display: block; }

  /* LEAGUE OVERVIEW STRIP */
  .overview-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .stat-pill .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat-pill .value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .stat-pill .sub { font-size: 12px; color: var(--muted); }

  /* TEAM GRID */
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  .team-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }

  .team-card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .team-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    line-height: 1;
  }

  .cap-block { text-align: right; }

  .cap-remaining {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }

  .cap-remaining.positive { color: var(--green); }
  .cap-remaining.zero { color: var(--orange); }
  .cap-remaining.negative { color: var(--red); }

  .cap-label { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }

  .cap-bar-wrap { padding: 0 18px 12px; border-bottom: 1px solid var(--border); }
  .cap-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .cap-bar {
    height: 6px;
    background: var(--surface);
    border-radius: 3px;
    overflow: hidden;
  }

  .cap-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  /* ROSTER */
  .roster-wrap { padding: 10px 0 4px; }

  .pos-group { margin-bottom: 0; }

  .pos-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 18px 3px;
  }

  .pos-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 4px;
    min-width: 28px;
    text-align: center;
  }

  .pos-badge.QB { background: rgba(59,130,246,0.18); color: #3b82f6; }
  .pos-badge.RB { background: rgba(34,197,94,0.15); color: #16a34a; }
  .pos-badge.WR { background: rgba(251,146,60,0.15); color: #ea580c; }
  .pos-badge.TE { background: rgba(192,132,252,0.18); color: #9333ea; }

  .player-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 8px;
    padding: 4px 18px;
    transition: background 0.15s;
  }

  .player-row:hover { background: rgba(255,255,255,0.03); }

  .player-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 2px 7px;
    border-radius: 4px;
  }

  .player-name.QB { background: rgba(59,130,246,0.14); }
  .player-name.RB { background: rgba(34,197,94,0.11); }
  .player-name.WR { background: rgba(251,146,60,0.11); }
  .player-name.TE { background: rgba(192,132,252,0.13); }

  .contract-cost {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    min-width: 28px;
    text-align: right;
  }

  .contract-cost.high { color: var(--accent2); }

  .years-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    min-width: 22px;
    text-align: center;
  }

  .years-pill.y3plus { background: #133a26; color: #4ade80; }
  .years-pill.y2 { background: #3a2d00; color: #fbbf24; }
  .years-pill.y1 { background: #3a1212; color: #f87171; }

  /* DRAFT CAPITAL */
  .draft-section { padding: 8px 18px 14px; border-top: 1px solid var(--border); margin-top: 4px; }

  .draft-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .picks-grid { display: flex; flex-wrap: wrap; gap: 5px; }

  .pick-chip {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
    border: 1px solid;
    line-height: 1.4;
  }

  .pick-chip.r1 { background: #1a2f1a; border-color: #22c55e; color: #4ade80; }
  .pick-chip.r2 { background: #1a1a2f; border-color: #3b82f6; color: #60a5fa; }

  /* SEARCH HIGHLIGHT */
  .search-result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: border-color 0.2s;
  }

  .search-result-card:hover { border-color: var(--accent); }

  .sr-left { display: flex; flex-direction: column; gap: 4px; }
  .sr-name { font-size: 16px; font-weight: 600; }
  .sr-team { font-size: 13px; color: var(--muted); }
  .sr-right { display: flex; align-items: center; gap: 10px; }

  /* RULES VIEW */
  .rules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .rules-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .rules-card h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .rule-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .rule-row:last-child { border-bottom: none; }
  .rule-key { color: var(--muted); }
  .rule-val { font-weight: 600; color: var(--text); text-align: right; max-width: 55%; }

  /* CAP VIEW */
  .cap-table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .cap-table {
    width: 100%;
    border-collapse: collapse;
  }

  .cap-table th {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 20px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .cap-table td {
    padding: 12px 20px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }

  .cap-table tr:last-child td { border-bottom: none; }
  .cap-table tr:hover td { background: rgba(255,255,255,0.02); }

  .cap-bar-inline {
    height: 8px;
    background: var(--surface);
    border-radius: 4px;
    overflow: hidden;
    min-width: 80px;
  }

  /* PICKS VIEW */
  .picks-table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .picks-year-group { }

  .picks-year-header {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .picks-row {
    display: grid;
    grid-template-columns: 1fr 1fr 80px 80px;
    padding: 10px 20px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    gap: 12px;
  }

  .picks-row:last-child { border-bottom: none; }
  .picks-row:hover { background: rgba(255,255,255,0.02); }
  .picks-row.header { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }

  /* SEARCH RESULTS */
  #search-results { display: flex; flex-direction: column; gap: 10px; }
  .no-results { color: var(--muted); text-align: center; padding: 48px; font-size: 14px; }

  /* EXPIRING */
  .expiring-section { margin-bottom: 28px; }
  .expiring-section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    border-radius: 10px 10px 0 0;
  }
  .expiring-table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .expiring-row {
    display: grid;
    grid-template-columns: 1fr 100px 60px 60px 80px;
    padding: 10px 20px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    gap: 12px;
  }
  .expiring-row:last-child { border-bottom: none; }
  .expiring-row:hover { background: rgba(255,255,255,0.02); }
  .expiring-row.header { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); background: var(--surface); }

  /* COMPARE */
  .compare-selectors {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .compare-selectors select {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    cursor: pointer;
    flex: 1;
    min-width: 160px;
  }
  .compare-selectors select:focus { border-color: var(--accent); }
  .vs-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--muted);
    flex-shrink: 0;
  }
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .compare-stat-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .compare-stat-row:last-child { border-bottom: none; }
  .compare-stat-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }
  .compare-val-left { text-align: right; font-weight: 600; }
  .compare-val-right { text-align: left; font-weight: 600; }
  .compare-winner { color: var(--accent); }

  /* LEGEND */
  .legend {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 12px;
  }

  .legend-label { color: var(--muted); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; font-size: 11px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px;
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    gap: 12px;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent);
    color: #0d0f14;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    z-index: 999;
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.3s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* Last updated */
  .last-updated {
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }

  @media (max-width: 600px) {
    .main { padding: 16px; }
    .team-grid { grid-template-columns: 1fr; }
    .header-inner { height: auto; padding: 12px 0; gap: 12px; }
    .nav-tabs { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Any Given Sunday <span>· Dynasty HQ</span></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search any player..." oninput="handleSearch(this.value)">
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showView('teams')">Teams</button>
      <button class="nav-tab" onclick="showView('expiring')">Expiring</button>
      <button class="nav-tab" onclick="showView('cap')">Cap</button>
      <button class="nav-tab" onclick="showView('compare')">Compare</button>
      <button class="nav-tab" onclick="showView('picks')">Picks</button>
      <button class="nav-tab" onclick="showView('rules')">Rules</button>
    </div>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
  </div>
</header>

<div class="main">
  <div id="loading" class="loading"><div class="spinner"></div> Loading league data...</div>

  <!-- SEARCH RESULTS -->
  <div id="search-view" class="view" style="display:none;">
    <div id="search-results"></div>
  </div>

  <!-- EXPIRING VIEW -->
  <div id="expiring-view" class="view" style="display:none;">
    <div id="expiring-container"></div>
  </div>

  <!-- COMPARE VIEW -->
  <div id="compare-view" class="view" style="display:none;">
    <div id="compare-container"></div>
  </div>

  <!-- TEAMS VIEW -->
  <div id="teams-view" class="view active" style="display:none;">
    <div class="overview-strip" id="overview-strip"></div>
    <div class="legend">
      <span class="legend-label">Contract Years</span>
      <span class="legend-item"><span class="legend-dot" style="background:#133a26;border:1px solid #22c55e;"></span> 3+ Years</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3a2d00;border:1px solid #fbbf24;"></span> 2 Years</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3a1212;border:1px solid #f87171;"></span> 1 Year (expiring)</span>
    </div>
    <div class="team-grid" id="team-grid"></div>
  </div>

  <!-- CAP VIEW -->
  <div id="cap-view" class="view" style="display:none;">
    <div class="cap-table-wrap">
      <table class="cap-table" id="cap-table">
        <thead>
          <tr>
            <th>Team</th>
            <th>Total Spent</th>
            <th>Cap Remaining</th>
            <th>Void Cost</th>
            <th>Roster Size</th>
            <th>Utilization</th>
          </tr>
        </thead>
        <tbody id="cap-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- PICKS VIEW -->
  <div id="picks-view" class="view" style="display:none;">
    <div class="picks-table-wrap" id="picks-container"></div>
  </div>

  <!-- RULES VIEW -->
  <div id="rules-view" class="view" style="display:none;">
    <div class="rules-grid" id="rules-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA — auto-populated by Google Apps Script
// ============================================================
const LEAGUE_DATA = {
  lastUpdated: "June 23, 2026",
  settings: {
    totalCap: 200,
    inSeasonCap: 250,
    rosterSize: 19,
    void1: 0.50,
    void2: 0.25,

// ============================================================
// RENDER
// ============================================================

function pickCost(pick) {
  if (pick.round === 2) return 1;
  const slot = parseInt((pick.pickNum || '').split('.')[1]) || 10;
  const costs = [10, 8, 8, 6, 6, 5, 4, 4, 3, 2];
  return costs[Math.min(slot, 10) - 1] || 2;
}

// Cumulative rookie cap hit for a team in a given season year.
// A rookie signed in draftYear on a 3-yr deal costs cap in draftYear, draftYear+1, draftYear+2.
function teamRookieCapInYear(team, year) {
  const DRAFT_YEARS = [2026, 2027, 2028, 2029];
  return DRAFT_YEARS.reduce((total, draftYear) => {
    if (draftYear > year) return total;
    const yearsIntoContract = year - draftYear;
    if (yearsIntoContract >= 3) return total;
    return total + team.picks
      .filter(p => p.year === draftYear)
      .reduce((s, p) => s + pickCost(p), 0);
  }, 0);
}

function posOrder(pos) {
  return { QB: 0, RB: 1, WR: 2, TE: 3 }[pos] ?? 4;
}

function yearsPill(years) {
  if (years >= 3) return `<span class="years-pill y3plus">${years}yr</span>`;
  if (years === 2) return `<span class="years-pill y2">${years}yr</span>`;
  return `<span class="years-pill y1">${years}yr</span>`;
}

function capColor(remaining) {
  if (remaining > 5) return 'positive';
  if (remaining >= 0) return 'zero';
  return 'negative';
}

function capFillColor(pct) {
  if (pct < 70) return '#22c55e';
  if (pct < 90) return '#f59e0b';
  return '#ef4444';
}

function buildTeamCard(team) {
  const cap = LEAGUE_DATA.settings.totalCap;
  const spent = team.players.reduce((s, p) => s + p.cost, 0);
  const pct = Math.min(100, (spent / cap) * 100);
  const fillColor = capFillColor(pct);
  const remClass = capColor(team.capRemaining);

  const byPos = {};
  team.players.forEach(p => {
    if (!byPos[p.pos]) byPos[p.pos] = [];
    byPos[p.pos].push(p);
  });

  const posOrder = ['QB', 'RB', 'WR', 'TE'];
  let rosterHtml = '';

  posOrder.forEach(pos => {
    if (!byPos[pos] || byPos[pos].length === 0) return;
    const sorted = byPos[pos].sort((a, b) => b.cost - a.cost);
    rosterHtml += `<div class="pos-group">`;
    sorted.forEach(p => {
      const costClass = p.cost >= 30 ? ' high' : '';
      rosterHtml += `
        <div class="player-row">
          <span class="player-name ${p.pos}">${p.name}</span>
          <span class="contract-cost${costClass}">$${p.cost}</span>
          ${yearsPill(p.years)}
        </div>`;
    });
    rosterHtml += `</div>`;
  });

  const picksHtml = team.picks.map(pick => {
    const cls = pick.round === 1 ? 'r1' : 'r2';
    const orig = pick.origTeam !== team.name ? ` <span style="color:var(--muted);font-size:10px;">(${pick.origTeam})</span>` : '';
    return `<span class="pick-chip ${cls}">${pick.year} R${pick.round}${orig}</span>`;
  }).join('');

  const voidHtml = team.voidCost > 0
    ? `<div style="padding:4px 18px 8px;font-size:11px;color:var(--red);">⚠ Void cost: $${team.voidCost}</div>`
    : '';

  return `
    <div class="team-card" id="card-${team.name}">
      <div class="team-header">
        <div>
          <div class="team-name">${team.name}</div>
          <div style="font-size:13px;font-weight:600;color:var(--text);margin-top:2px;">${team.record} &nbsp;<span style="color:var(--muted);font-weight:400;">·</span>&nbsp; <span style="color:var(--accent);">${team.pf} PF</span></div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">${team.players.length} players · $${spent} spent</div>
        </div>
        <div class="cap-block">
          <div class="cap-remaining ${remClass}">$${team.capRemaining}</div>

        </div>
      </div>
      <div class="cap-bar-wrap">
        <div class="cap-bar-label">
          <span>$0</span>
          <span style="color:var(--muted);">$${spent} / $${cap}</span>
          <span>$${cap}</span>
        </div>
        <div class="cap-bar">
          <div class="cap-fill" style="width:${pct}%;background:${fillColor};"></div>

}

function renderTeams() {
  const grid = document.getElementById('team-grid');
  const strip = document.getElementById('overview-strip');

  const totalPlayers = LEAGUE_DATA.teams.reduce((s, t) => s + t.players.length, 0);
  const totalSpent = LEAGUE_DATA.teams.reduce((s, t) => s + t.players.reduce((x, p) => x + p.cost, 0), 0);
  const avgCap = Math.round(totalSpent / LEAGUE_DATA.teams.length);
  const expiringCount = LEAGUE_DATA.teams.reduce((s, t) => s + t.players.filter(p => p.years === 1).length, 0);

  strip.innerHTML = `
    <div class="stat-pill"><div class="label">Teams</div><div class="value">${LEAGUE_DATA.teams.length}</div></div>
    <div class="stat-pill"><div class="label">Total Players</div><div class="value">${totalPlayers}</div></div>
    <div class="stat-pill"><div class="label">Avg Cap Spent</div><div class="value">$${avgCap}</div><div class="sub">of $${LEAGUE_DATA.settings.totalCap} cap</div></div>
    <div class="stat-pill"><div class="label">Expiring Contracts</div><div class="value">${expiringCount}</div><div class="sub">after this season</div></div>
    <div class="stat-pill"><div class="label">Last Updated</div><div class="value" style="font-size:14px;margin-top:4px;">${LEAGUE_DATA.lastUpdated || '—'}</div></div>
  `;

  grid.innerHTML = LEAGUE_DATA.teams.map(buildTeamCard).join('');
}

function renderCap() {
  const tbody = document.getElementById('cap-tbody');
  const cap = LEAGUE_DATA.settings.totalCap;

  const rows = [...LEAGUE_DATA.teams].sort((a, b) => b.capRemaining - a.capRemaining).map(team => {
    const spent = team.players.reduce((s, p) => s + p.cost, 0);
    const pct = Math.min(100, (spent / cap) * 100);
    const fillColor = capFillColor(pct);
    const remClass = capColor(team.capRemaining);
    return `
      <tr>
        <td><strong>${team.name}</strong></td>
        <td>$${spent}</td>
        <td class="${remClass}" style="font-weight:700;color:${team.capRemaining > 5 ? 'var(--green)' : team.capRemaining >= 0 ? 'var(--orange)' : 'var(--red)'}">$${team.capRemaining}</td>
        <td style="color:${team.voidCost > 0 ? 'var(--red)' : 'var(--muted)'}">$${team.voidCost}</td>
        <td>${team.players.length} / ${LEAGUE_DATA.settings.rosterSize}</td>
        <td>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="cap-bar-inline"><div style="height:100%;background:${fillColor};width:${pct}%;border-radius:4px;"></div></div>
            <span style="font-size:12px;color:var(--muted);">${Math.round(pct)}%</span>
          </div>
        </td>
      </tr>`;
  });

  tbody.innerHTML = rows.join('');

  // Cap by year section
  const years = [2026, 2027, 2028, 2029];

  // Compute cap committed per team per year
  const teamsSorted = [...LEAGUE_DATA.teams].sort((a, b) => b.capRemaining - a.capRemaining);

  let byYearHtml = `
    <div style="margin-top:28px;">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;">Cap Committed by Year</div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;">
        <table style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="background:var(--surface);">
              <th style="font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:12px 20px;text-align:left;border-bottom:1px solid var(--border);">Team</th>
              ${years.map(y => `<th style="font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:12px 16px;text-align:center;border-bottom:1px solid var(--border);">${y}</th>`).join('')}
            </tr>
          </thead>
          <tbody>`;

  teamsSorted.forEach(team => {
    byYearHtml += `<tr onmouseover="this.style.background='rgba(255,255,255,0.02)'" onmouseout="this.style.background=''">
      <td style="padding:11px 20px;font-weight:600;font-size:13px;border-bottom:1px solid var(--border);">${team.name}</td>`;

    years.forEach(year => {
      const committed = team.players
        .filter(p => {
          const startYear = 2026;
          const endYear = startYear + p.years - 1;
          return year >= startYear && year <= endYear;
        })
        .reduce((s, p) => s + p.cost, 0);
      const rookieHit = teamRookieCapInYear(team, year);
      const trueTotal = committed + rookieHit;
      const free = cap - trueTotal;
      const pct = Math.min(100, (trueTotal / cap) * 100);
      const fillColor = pct < 70 ? 'var(--green)' : pct < 90 ? 'var(--orange)' : 'var(--red)';
      const freeColor = free > 20 ? 'var(--green)' : free >= 0 ? 'var(--orange)' : 'var(--red)';
      byYearHtml += `
        <td style="padding:8px 16px;border-bottom:1px solid var(--border);text-align:center;">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:${fillColor};">$${trueTotal}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:1px;">$${committed} contracts${rookieHit > 0 ? ' <span style=\'color:var(--orange);\'>+~$' + rookieHit + ' rookies</span>' : ''}</div>
          <div style="font-size:10px;color:${freeColor};margin-top:1px;font-weight:600;">$${free} free</div>
          <div style="height:4px;background:var(--surface);border-radius:2px;margin-top:4px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:${fillColor};border-radius:2px;"></div>
          </div>
        </td>`;
    });
    byYearHtml += `</tr>`;
  });

  byYearHtml += `</tbody></table>
    <div style="padding:8px 20px;font-size:11px;color:var(--muted);font-style:italic;">Cap committed = active contracts only · Rookie pick estimates shown in orange on team cards and Cap table · Based on $${cap} cap</div>
    </div></div>`;

  document.getElementById('cap-view').insertAdjacentHTML('beforeend', byYearHtml);
}

function renderPicks() {
  const container = document.getElementById('picks-container');

  // Standings table at top
  const standings = [...LEAGUE_DATA.teams].sort((a, b) => {
    const aW = parseInt(a.record.split('-')[0]);
    const bW = parseInt(b.record.split('-')[0]);
    if (bW !== aW) return bW - aW;
    if (b.pf !== a.pf) return b.pf - a.pf;
    return a.name.localeCompare(b.name);
  });

  let standingsHtml = `
    <div style="padding:14px 20px 10px;background:var(--surface);border-bottom:1px solid var(--border);">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);">2026 Standings</div>
    </div>
    <div style="display:grid;grid-template-columns:30px 1fr 70px 80px 80px;padding:8px 20px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);">
      <span>#</span><span>Team</span><span style="text-align:center;">W-L</span><span style="text-align:right;">PF</span><span style="text-align:right;">Draft Slot</span>
    </div>`;

  standings.forEach((team, i) => {
    const isTop2 = i < 2;
    const isBottom2 = i >= standings.length - 2;
    const rankColor = isTop2 ? 'var(--green)' : isBottom2 ? 'var(--red)' : 'var(--muted)';
    const draftSlot = standings.length - i; // worst record = pick 1, best = pick 10
    standingsHtml += `
      <div style="display:grid;grid-template-columns:30px 1fr 70px 80px 80px;padding:10px 20px;font-size:13px;border-bottom:1px solid var(--border);align-items:center;" onmouseover="this.style.background='rgba(255,255,255,0.02)'" onmouseout="this.style.background=''">
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;color:${rankColor};">${i + 1}</span>
        <span style="font-weight:600;">${team.name}</span>
        <span style="text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;">${team.record}</span>
        <span style="text-align:right;color:var(--accent);font-weight:600;">${team.pf > 0 ? team.pf.toFixed(1) : '—'}</span>
        <span style="text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:${draftSlot <= 3 ? 'var(--green)' : draftSlot >= 8 ? 'var(--red)' : 'var(--text)'};">${draftSlot}</span>
      </div>`;
  });
  standingsHtml += `<div style="padding:8px 20px;font-size:11px;color:var(--muted);font-style:italic;border-bottom:1px solid var(--border);">Sorted by W-L, then PF, then alphabetical · Pick order is reverse standings (1st place = pick 10)</div>`;

  container.innerHTML = standingsHtml;
  // Build a standings-driven pick slot lookup: teamName -> slot (1=worst, 10=best)
  // standings array is already sorted above (index 0 = best record)
  const draftSlotMap = {};
  standings.forEach((team, i) => {
    draftSlotMap[team.name] = standings.length - i; // reverse: last place = slot 1
  });

  const allPicks = [];
  LEAGUE_DATA.teams.forEach(team => {
    team.picks.forEach(pick => {
      allPicks.push({ owner: team.name, ...pick });
    });
  });

  const byYear = {};
  allPicks.forEach(p => {
    if (!byYear[p.year]) byYear[p.year] = [];
    byYear[p.year].push(p);
  });

  const years = Object.keys(byYear).sort();
  let html = '';

  years.forEach(year => {
    // Sort by round, then by the draft slot of the ORIGINAL team (worst record picks first)
    const picks = byYear[year].sort((a, b) => {
      if (a.round !== b.round) return a.round - b.round;
      const aSlot = draftSlotMap[a.origTeam] || 99;
      const bSlot = draftSlotMap[b.origTeam] || 99;
      return aSlot - bSlot;
    });

    html += `<div class="picks-year-group">
      <div class="picks-year-header">${year} Draft</div>
      <div class="picks-row header"><span>Owner</span><span>Original Team</span><span>Round</span><span>Pick #</span></div>`;

    // Track pick numbers per round for this year
    let r1Count = 0, r2Count = 0;
    picks.forEach(p => {
      const cls = p.round === 1 ? 'color:var(--green)' : 'color:var(--blue)';
      const pickNum = p.round === 1 ? ++r1Count : ++r2Count;
      html += `
        <div class="picks-row">
          <span style="font-weight:600;">${p.owner}</span>
          <span style="color:${p.origTeam !== p.owner ? 'var(--accent2)' : 'var(--muted)'};">${p.origTeam}</span>
          <span style="${cls};font-weight:700;">Rd ${p.round}</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;${cls}">${p.round}.0${pickNum}</span>
        </div>`;
    });
    html += `</div>`;
  });

  container.innerHTML += html;
}

function renderExpiring() {
  const container = document.getElementById('expiring-container');
  const positions = ['QB', 'RB', 'WR', 'TE'];
  let html = '';

  // Group all expiring players (years === 1) by position
  const byPos = { QB: [], RB: [], WR: [], TE: [] };
  LEAGUE_DATA.teams.forEach(team => {
    team.players.forEach(p => {
      if (p.years === 1 && byPos[p.pos]) {
        byPos[p.pos].push({ ...p, teamName: team.name });
      }
    });
  });

  positions.forEach(pos => {
    const players = byPos[pos].sort((a, b) => b.cost - a.cost);
    if (!players.length) return;
    const posColors = { QB: '#60a5fa', RB: '#4ade80', WR: '#fb923c', TE: '#c084fc' };
    html += `
      <div class="expiring-section">
        <div class="expiring-table-wrap">
          <div class="expiring-row header" style="border-left: 3px solid ${posColors[pos]};">
            <span>${pos} — ${players.length} expiring</span>
            <span>Team</span>
            <span style="text-align:right;">Cost</span>
            <span style="text-align:right;">Yrs</span>
            <span style="text-align:right;">Action</span>
          </div>`;
    players.forEach(p => {
      html += `
        <div class="expiring-row" style="border-left: 3px solid ${posColors[pos]}20;">
          <span style="font-weight:600;">${p.name}</span>
          <span style="color:var(--muted);">${p.teamName}</span>
          <span style="text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--accent2);">$${p.cost}</span>
          <span style="text-align:right;"><span class="years-pill y1">1yr</span></span>
          <span style="text-align:right;font-size:11px;color:var(--red);font-weight:600;">FREE AGENT</span>
        </div>`;
    });
    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function renderCompare() {
  const container = document.getElementById('compare-container');
  const teamNames = LEAGUE_DATA.teams.map(t => t.name);

  const selectorHtml = `
    <div class="compare-selectors">
      <select id="compare-left" onchange="updateComparison()">
        ${teamNames.map((n, i) => `<option value="${i}"${i===0?' selected':''}>${n}</option>`).join('')}
      </select>
      <div class="vs-label">VS</div>
      <select id="compare-right" onchange="updateComparison()">
        ${teamNames.map((n, i) => `<option value="${i}"${i===1?' selected':''}>${n}</option>`).join('')}
      </select>
    </div>
    <div id="compare-body"></div>`;

  container.innerHTML = selectorHtml;
  updateComparison();
}

function updateComparison() {
  const li = parseInt(document.getElementById('compare-left').value);
  const ri = parseInt(document.getElementById('compare-right').value);
  const L = LEAGUE_DATA.teams[li];
  const R = LEAGUE_DATA.teams[ri];
  const cap = LEAGUE_DATA.settings.totalCap;

  const lSpent = L.players.reduce((s, p) => s + p.cost, 0);
  const rSpent = R.players.reduce((s, p) => s + p.cost, 0);
  const lExpiring = L.players.filter(p => p.years === 1).length;
  const rExpiring = R.players.filter(p => p.years === 1).length;
  const lPicks1 = L.picks.filter(p => p.round === 1).length;
  const rPicks1 = R.picks.filter(p => p.round === 1).length;
  const lPicks2 = L.picks.filter(p => p.round === 2).length;
  const rPicks2 = R.picks.filter(p => p.round === 2).length;
  const lLocked = L.players.filter(p => p.years >= 3).length;
  const rLocked = R.players.filter(p => p.years >= 3).length;
  const lAvgCost = L.players.length ? Math.round(lSpent / L.players.length) : 0;
  const rAvgCost = R.players.length ? Math.round(rSpent / R.players.length) : 0;

  const posCount = (team, pos) => team.players.filter(p => p.pos === pos).length;

  function statRow(label, lVal, rVal, higherIsBetter = true) {
    const lNum = typeof lVal === 'string' ? parseFloat(lVal.replace('$','')) : lVal;
    const rNum = typeof rVal === 'string' ? parseFloat(rVal.replace('$','')) : rVal;
    const lWins = higherIsBetter ? lNum > rNum : lNum < rNum;
    const rWins = higherIsBetter ? rNum > lNum : rNum < lNum;
    return `<div class="compare-stat-row">
      <span class="compare-val-left ${lWins ? 'compare-winner' : ''}">${typeof lVal === 'number' && label.includes('$') ? '$'+lVal : lVal}</span>
      <span class="compare-stat-label">${label}</span>
      <span class="compare-val-right ${rWins ? 'compare-winner' : ''}">${typeof rVal === 'number' && label.includes('$') ? '$'+rVal : rVal}</span>
    </div>`;
  }

  const body = document.getElementById('compare-body');
  body.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
      <div style="text-align:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:var(--accent);">${L.name}</div>
        <div style="font-size:13px;color:var(--muted);">${L.record} · ${L.players.length} players</div>
      </div>
      <div style="text-align:center;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:var(--accent2);">${R.name}</div>
        <div style="font-size:13px;color:var(--muted);">${R.record} · ${R.players.length} players</div>
      </div>
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;">
      <div style="padding:10px 16px;background:var(--surface);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);">Cap & Contracts</div>
      ${statRow('Cap Remaining', L.capRemaining, R.capRemaining)}
      ${statRow('Cap Spent', lSpent, rSpent, false)}
      ${statRow('Avg Contract $', lAvgCost, rAvgCost, false)}
      ${statRow('Roster Size', L.players.length, R.players.length)}
      ${statRow('Expiring (1yr)', lExpiring, rExpiring, false)}
      ${statRow('Long-term Locked (3yr+)', lLocked, rLocked)}
      ${statRow('Void Cost', L.voidCost, R.voidCost, false)}
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;">
      <div style="padding:10px 16px;background:var(--surface);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);">Draft Capital</div>
      ${statRow('1st Round Picks', lPicks1, rPicks1)}
      ${statRow('2nd Round Picks', lPicks2, rPicks2)}
      ${statRow('Total Picks', L.picks.length, R.picks.length)}
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;">
      <div style="padding:10px 16px;background:var(--surface);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);">Positional Depth</div>
      ${statRow('QBs', posCount(L,'QB'), posCount(R,'QB'))}
      ${statRow('RBs', posCount(L,'RB'), posCount(R,'RB'))}
      ${statRow('WRs', posCount(L,'WR'), posCount(R,'WR'))}
      ${statRow('TEs', posCount(L,'TE'), posCount(R,'TE'))}
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;">
      <div style="padding:10px 16px;background:var(--surface);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);">Cap Committed by Year</div>
      ${[2026,2027,2028,2029].map(year => {
        const lC = L.players.filter(p => { const e = 2026 + p.years - 1; return year >= 2026 && year <= e; }).reduce((s,p) => s+p.cost, 0);
        const rC = R.players.filter(p => { const e = 2026 + p.years - 1; return year >= 2026 && year <= e; }).reduce((s,p) => s+p.cost, 0);
        const lR = teamRookieCapInYear(L, year);
        const rR = teamRookieCapInYear(R, year);
        const lTotal = lC + lR; const rTotal = rC + rR;
        const lFree = 200 - lTotal; const rFree = 200 - rTotal;
        const lWins = lFree > rFree;
        const rWins = rFree > lFree;
        const lLabel = '$'+lTotal + (lR>0?' <span style="font-size:10px;color:var(--orange);">+~$'+lR+' rookies</span>':'') + ' <span style="font-size:10px;color:var(--muted);">($'+lFree+' free)</span>';
        const rLabel = '<span style="font-size:10px;color:var(--muted);">($'+rFree+' free)</span> ' + (rR>0?'<span style="font-size:10px;color:var(--orange);">+~$'+rR+' rookies</span> ':'') + '$'+rTotal;
        return '<div class="compare-stat-row">' +
          '<span class="compare-val-left ' + (lWins?'compare-winner':'') + '">' + lLabel + '</span>' +
          '<span class="compare-stat-label">' + year + '</span>' +
          '<span class="compare-val-right ' + (rWins?'compare-winner':'') + '">' + rLabel + '</span>' +
          '</div>';
      }).join('')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;">
        <div style="padding:10px 16px;background:var(--surface);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);">${L.name}'s Picks</div>
        ${L.picks.map(p => `<div style="padding:8px 16px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;"><span class="pick-chip ${p.round===1?'r1':'r2'}">${p.year} R${p.round}</span><span style="color:var(--muted);">${p.origTeam !== L.name ? p.origTeam : 'Own'}</span></div>`).join('') || '<div style="padding:12px 16px;color:var(--muted);font-size:12px;">No picks on file</div>'}
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;">
        <div style="padding:10px 16px;background:var(--surface);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent2);">${R.name}'s Picks</div>
        ${R.picks.map(p => `<div style="padding:8px 16px;border-bottom:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;"><span class="pick-chip ${p.round===1?'r1':'r2'}">${p.year} R${p.round}</span><span style="color:var(--muted);">${p.origTeam !== R.name ? p.origTeam : 'Own'}</span></div>`).join('') || '<div style="padding:12px 16px;color:var(--muted);font-size:12px;">No picks on file</div>'}
      </div>
    </div>`;
}

function renderRules() {
  const grid = document.getElementById('rules-grid');
  const sections = [
    { title: 'League Overview', items: LEAGUE_DATA.rules.overview },
    { title: 'Playoffs', items: LEAGUE_DATA.rules.playoffs },
    { title: 'Fees & Payouts', items: LEAGUE_DATA.rules.fees },
    { title: 'Cap Structure', items: LEAGUE_DATA.rules.cap },
    { title: 'Rookie Draft', items: LEAGUE_DATA.rules.rookieDraft },
    { title: 'Contract Costs (Rookies)', items: LEAGUE_DATA.rules.contractCosts },
    { title: 'Roster Rules', items: LEAGUE_DATA.rules.roster },
    { title: 'Scoring', items: LEAGUE_DATA.rules.scoring },
    { title: 'Governance', items: LEAGUE_DATA.rules.governance },
  ];

  grid.innerHTML = sections.map(s => `
    <div class="rules-card">
      <h3>${s.title}</h3>
      ${s.items.map(r => `
        <div class="rule-row">
          <span class="rule-key">${r.key}</span>
          <span class="rule-val">${r.val}</span>
        </div>`).join('')}
    </div>`).join('');
}

// ============================================================
// SEARCH
// ============================================================

function handleSearch(query) {
  const q = query.trim().toLowerCase();

  if (!q) {
    document.getElementById('search-view').style.display = 'none';
    document.getElementById(currentView + '-view').style.display = 'block';
    return;
  }

  document.getElementById(currentView + '-view').style.display = 'none';
  document.getElementById('search-view').style.display = 'block';

  const results = [];
  LEAGUE_DATA.teams.forEach(team => {
    team.players.forEach(p => {
      if (p.name.toLowerCase().includes(q)) {
        results.push({ ...p, teamName: team.name });
      }
    });
  });

  const el = document.getElementById('search-results');
  if (results.length === 0) {
    el.innerHTML = `<div class="no-results">No players found matching "${query}"</div>`;
    return;
  }

  el.innerHTML = results.map(r => `
    <div class="search-result-card">
      <div class="sr-left">
        <div class="sr-name">${r.name}</div>
        <div class="sr-team">${r.teamName} · <span class="pos-badge ${r.pos}" style="display:inline;padding:1px 5px;">${r.pos}</span></div>
      </div>
      <div class="sr-right">
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--accent2);">$${r.cost}</span>
        ${yearsPill(r.years)}
      </div>
    </div>`).join('');
}

// ============================================================
// NAV
// ============================================================

let currentView = 'teams';

function showView(view) {
  document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(view + '-view').style.display = 'block';
  document.querySelector(`.nav-tab[onclick="showView('${view}')"]`).classList.add('active');
  currentView = view;
  if (view === 'compare') renderCompare();

  const searchInput = document.getElementById('search-input');
  if (searchInput.value.trim()) {
    document.getElementById('search-view').style.display = 'block';
    document.getElementById(view + '-view').style.display = 'none';
  }
}

// ============================================================
// INIT
// ============================================================

function toggleTheme() {
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  if (root.classList.contains('light')) {
    root.classList.remove('light');
    btn.textContent = '🌙 Dark';
    localStorage.setItem('dynasty-theme', 'dark');
  } else {
    root.classList.add('light');
    btn.textContent = '☀️ Light';
    localStorage.setItem('dynasty-theme', 'light');
  }
}

function init() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('teams-view').style.display = 'block';
  // Apply saved theme
  const savedTheme = localStorage.getItem('dynasty-theme');
  if (savedTheme === 'light') {
    document.documentElement.classList.add('light');
    document.getElementById('theme-toggle').textContent = '☀️ Light';
  }

  renderTeams();
  renderExpiring();
  renderCap();
  renderPicks();
  renderRules();
}

init();
</script>
</body>
</html>
